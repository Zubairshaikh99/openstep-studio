name: Feature request
description: Suggest an improvement to the screenshot tutorial editor
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the user need before proposing a feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My idea can be implemented without uploading screenshots to a server, or I have explained why it cannot.
